# Save as .github/workflows/uefi-port.yml in a PRIVATE fork of
#   https://github.com/Project-Silicium/Mu-Silicium
# (private because the extracted Binaries/ come from your phone's firmware and are vendor files)
#
# Commit these before running it:
#   .ci/silicium_port.py        the script I wrote (silicium_port.py)
#   port-input/device-tree.dtb  adb pull /sys/firmware/fdt   (check chosen/bootargs for your serial number)
#   port-input/xbl.img          your phone's xbl partition (guide: dd if=/dev/block/by-name/xbl* ...)
#                               The partition may be named xbl_a; the same file is in Motorola's stock
#                               firmware package, but I have not verified that.
#
# What it does, following Project Silicium's "Adding Devices / Adding SoCs" guides:
#   1. extracts UEFI binaries + uefiplat.cfg from xbl.img with UEFIReader
#   2. copies a SIMILAR existing platform and SoC package, renames them, new GUID
#   3. regenerates the memory map, config map, GIC/timer/core PCDs and FD values from your files
#   4. commits the result to branch port/<codename> and tries a DEBUG build
#
# What it does NOT do (guide steps that need eyes or the phone):
#   - APRIORI.inc / DXE.inc / RAW.inc order (UEFITool), SmBios + cache sizes, ACPI, boot image script,
#     the SoC's timer PCDs cross-check, and every boot test. Expect the first builds to fail or
#     the image not to boot. The branch is your starting point to fix those.
# The guides are marked outdated by the project, so paths may differ. Untested on the real repo.

name: Port and build UEFI

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Codename for the new platform"
        default: "kiev"
      vendor:
        description: "Vendor folder under Platforms/"
        default: "Motorola"
      soc:
        description: "SoC name for the new SoC package"
        default: "SM7225"
      base_platform:
        description: "Existing similar platform dir to copy, e.g. Platforms/Xiaomi/limePkg"
        required: true
      base_soc:
        description: "Existing similar SoC dir to copy, e.g. Silicon/Qualcomm/SM7125Pkg"
        required: true

permissions:
  contents: write

env:
  CODE: ${{ inputs.codename }}
  VENDOR: ${{ inputs.vendor }}
  SOC: ${{ inputs.soc }}
  BASE_PLAT: ${{ inputs.base_platform }}
  BASE_SOC: ${{ inputs.base_soc }}

jobs:
  port:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler uuid-runtime p7zip-full
          for f in .ci/silicium_port.py port-input/device-tree.dtb port-input/xbl.img "$BASE_PLAT" "$BASE_SOC"; do
            test -e "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Extract binaries and uefiplat.cfg with UEFIReader
        run: |
          git clone --depth 1 https://github.com/WOA-Project/UEFIReader.git /tmp/UEFIReader
          dotnet build /tmp/UEFIReader/UEFIReader.sln -c Release
          DLL=$(find /tmp/UEFIReader -name UEFIReader.dll -path "*Release*" | head -1)
          mkdir -p /tmp/xbl-out
          dotnet "$DLL" port-input/xbl.img /tmp/xbl-out
          find /tmp/xbl-out -maxdepth 2 | head -50
          find /tmp/xbl-out -name uefiplat.cfg | grep -q . || { echo "::error::uefiplat.cfg not found in UEFIReader output"; exit 1; }

      - name: Copy and rename the base platform
        run: |
          OLD=$(basename "$BASE_PLAT" | sed 's/Pkg$//')
          NEW_PLAT="Platforms/$VENDOR/${CODE}Pkg"
          mkdir -p "Platforms/$VENDOR"
          cp -r "$BASE_PLAT" "$NEW_PLAT"
          # rename files, then contents
          find "$NEW_PLAT" -depth -name "*$OLD*" | while read -r p; do
            mv "$p" "$(dirname "$p")/$(basename "$p" | sed "s/$OLD/$CODE/g")"
          done
          grep -rIl "$OLD" "$NEW_PLAT" | xargs -r sed -i "s/${OLD}Pkg/${CODE}Pkg/g; s/$OLD/$CODE/g"
          # fresh GUID
          DSC=$(find "$NEW_PLAT" -name "*.dsc" | head -1)
          OLDGUID=$(grep -m1 -oP 'PLATFORM_GUID\s*=\s*\K[0-9A-Fa-f-]+' "$DSC")
          NEWGUID=$(uuidgen | tr a-z A-Z)
          sed -i "s/$OLDGUID/$NEWGUID/" "$DSC"
          echo "old=$OLD guid $OLDGUID -> $NEWGUID" | tee -a port.log
          # config file
          CONF_OLD="Resources/Configs/$OLD.conf"
          test -f "$CONF_OLD" && cp "$CONF_OLD" "Resources/Configs/$CODE.conf" || echo "::warning::$CONF_OLD not found; create Resources/Configs/$CODE.conf by hand"
          echo "NEW_PLAT=$NEW_PLAT" >> "$GITHUB_ENV"

      - name: Copy and rename the base SoC package
        run: |
          OLDSOC=$(basename "$BASE_SOC" | sed 's/Pkg$//')
          NEW_SOC="Silicon/Qualcomm/${SOC}Pkg"
          if [ -e "$NEW_SOC" ]; then echo "$NEW_SOC already exists, keeping it"; else
            cp -r "$BASE_SOC" "$NEW_SOC"
            find "$NEW_SOC" -depth -name "*$OLDSOC*" | while read -r p; do
              mv "$p" "$(dirname "$p")/$(basename "$p" | sed "s/$OLDSOC/$SOC/g")"
            done
            grep -rIl "$OLDSOC" "$NEW_SOC" | xargs -r sed -i "s/$OLDSOC/$SOC/g"
          fi
          # platform must point at the new SoC include
          grep -rIl "${OLDSOC}Pkg\|$OLDSOC.dsc.inc" "$NEW_PLAT" | xargs -r sed -i "s/$OLDSOC/$SOC/g"
          echo "NEW_SOC=$NEW_SOC" >> "$GITHUB_ENV"

      - name: Place binaries and device tree
        run: |
          mkdir -p "Binaries/$CODE" Resources/DTBs "$NEW_PLAT/FdtBlob"
          cp -r /tmp/xbl-out/. "Binaries/$CODE/"
          test -f Binaries/CleanUp.sh && (cd Binaries && bash CleanUp.sh) || true
          dtc -I dtb -O dts -q port-input/device-tree.dtb > "Resources/DTBs/$CODE.dts" || true
          cp port-input/device-tree.dtb "Resources/DTBs/$CODE.dtb"
          cp port-input/device-tree.dtb "$NEW_PLAT/FdtBlob/$CODE.dtb"

      - name: Generate memory map, config map, SoC PCDs, FD values
        run: |
          MM=$(find "$NEW_PLAT" -name DeviceMemoryMapLib.c | head -1)
          CM=$(find "$NEW_PLAT" -name DeviceConfigurationMapLib.c | head -1)
          SOCINC=$(find "$NEW_SOC" -name "*.dsc.inc" | head -1)
          CFG=$(find /tmp/xbl-out -name uefiplat.cfg | head -1)
          ARGS=""
          test -f "Resources/Configs/$CODE.conf" && ARGS="--device-conf Resources/Configs/$CODE.conf"
          python3 -I .ci/silicium_port.py --dts "Resources/DTBs/$CODE.dts" --cfg "$CFG" \
            --memmap-template "$MM" --confmap-template "$CM" \
            --out-memmap "$MM" --out-confmap "$CM" \
            --soc-dsc-inc "$SOCINC" $ARGS --report port-report.md | tee -a port.log

      - name: Commit to branch port/${{ inputs.codename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "port/$CODE"
          git add -A Platforms Silicon Resources Binaries port-report.md
          git commit -m "Generated first-pass $CODE port (needs manual APRIORI/DXE/SmBios/ACPI work)"
          git push -f origin "port/$CODE"

      - name: Try a DEBUG build
        id: build
        continue-on-error: true
        run: |
          ./setup_env.sh -p apt
          ./build_uefi.sh -d "$CODE" -r DEBUG 2>&1 | tee build.log

      - name: Upload report, logs, image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ inputs.codename }}
          path: |
            port-report.md
            port.log
            build.log
            **/*.img
            **/*.tar
            **/*.bin
          retention-days: 14
