# Save as .github/workflows/uefi-port.yml in a PRIVATE repo of yours.
#
# Your repo only has to hold the INPUT files:
#   .ci/silicium_port.py        the script (silicium_port.py)
#   port-input/device-tree.dtb  device tree from the phone, with serial/MAC blanked
#   port-input/xbl.img          the phone's xbl_a partition
#
# Modes (picked automatically):
#   existing  a platform for the codename already exists -> skip porting, just build
#   copy      a similar platform (same SoC family first) exists -> copy + rename it
#   scaffold  NO similar platform exists -> create an empty platform dir from scratch
# The SoC package works the same way: keep it if it exists, copy the closest one,
# or scaffold a new Silicon/Qualcomm/<SoC>Pkg from scratch if there is nothing to copy.
#
# NOT done (needs eyes or the phone): APRIORI/DXE/RAW order (UEFITool), SmBios, cache sizes,
# ACPI, boot image script, boot tests. Scaffolded trees are skeletons: expect the first builds
# to fail; the artifact is your starting point.
# The artifact contains vendor binaries from your xbl: keep this repo private.

name: Port and build UEFI

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Codename for the platform"
        default: "kiev"
      vendor:
        description: "Vendor folder under Platforms/"
        default: "Motorola"
      soc:
        description: "SoC name"
        default: "SM7225"
      uefi_repo:
        description: "UEFI source repo to build from"
        default: "Project-Silicium/Mu-Silicium"
      base_platform:
        description: "Platform dir to copy, relative to the UEFI repo ('auto' = closest, scaffold if none)"
        default: "auto"
      base_soc:
        description: "SoC dir to copy ('auto' = follow the chosen platform, scaffold if none)"
        default: "auto"

permissions:
  contents: read

env:
  CODE: ${{ inputs.codename }}
  VENDOR: ${{ inputs.vendor }}
  SOC: ${{ inputs.soc }}
  IN_PLAT: ${{ inputs.base_platform }}
  IN_SOC: ${{ inputs.base_soc }}

jobs:
  port:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mu
    steps:
      - name: Check out your repo (the inputs)
        uses: actions/checkout@v4
        with:
          path: inputs

      - name: Check out the UEFI source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repo }}
          path: mu
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tools and input check
        run: |
          for f in .ci/silicium_port.py port-input/device-tree.dtb port-input/xbl.img; do
            test -e "../inputs/$f" || { echo "::error::Missing $f in your repo"; exit 1; }
          done
          mkdir -p .ci port-input
          cp ../inputs/.ci/silicium_port.py .ci/
          cp ../inputs/port-input/device-tree.dtb ../inputs/port-input/xbl.img port-input/
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler uuid-runtime p7zip-full
          echo "Top level of the UEFI repo:"; ls

      - name: Decide mode (existing / copy / scaffold)
        run: |
          python3 -I - <<'PY'
          import glob, os, re

          code = os.environ["CODE"].lower()
          soc = os.environ["SOC"]
          vendor = os.environ["VENDOR"]
          env = open(os.environ["GITHUB_ENV"], "a")

          def pkg_dir(d):
              while d and not d.endswith("Pkg") and d.count("/") > 1:
                  d = os.path.dirname(d)
              return d

          existing = [p for p in glob.glob("Platforms/*/*") if code in p.lower() and os.path.isdir(p)]
          if existing:
              print("Existing platform found:", existing[0])
              env.write("MODE=existing\nNEW_PLAT=%s\n" % existing[0])
              raise SystemExit(0)

          rows = []
          for dsc in glob.glob("Platforms/**/*.dsc", recursive=True):
              t = open(dsc, errors="replace").read()
              m = re.search(r"!include\s+\S*?((?:SM|SDM|MSM)\d+)\S*\.dsc\.inc", t)
              if m:
                  d = pkg_dir(os.path.dirname(dsc))
                  if os.path.isdir(d):
                      rows.append((m.group(1), d))

          plat, base_soc_name = "", ""
          if os.environ["IN_PLAT"] not in ("", "auto"):
              if os.path.isdir(os.environ["IN_PLAT"]):
                  plat = os.environ["IN_PLAT"]
                  base_soc_name = next((s for s, d in rows if d == plat), "")
          elif rows:
              pref = [soc, "SM7250", "SM7125", "SM7150", "SM7325", "SM6350", "SM6375",
                      "SM6225", "SM6125", "SM6115", "SM8250", "SM8150"]
              for want in pref:
                  hit = next((d for s, d in rows if s == want), None)
                  if hit:
                      plat, base_soc_name = hit, want
                      break
              if not plat:
                  base_soc_name, plat = rows[0]

          socdir = ""
          if os.environ["IN_SOC"] not in ("", "auto"):
              if os.path.isdir(os.environ["IN_SOC"]):
                  socdir = os.environ["IN_SOC"]
          elif base_soc_name:
              cands = ["Silicon/Qualcomm/%sPkg" % base_soc_name] + sorted(glob.glob("Silicon/Qualcomm/*%s*" % base_soc_name))
              socdir = next((c for c in cands if os.path.isdir(c)), "")

          mode = "copy" if plat else "scaffold"
          print("MODE          :", mode)
          print("Base platform :", plat or "(none -> scaffold new platform dir)")
          print("Base SoC dir  :", socdir or "(none -> scaffold new SoC dir unless it already exists)")
          env.write("MODE=%s\nBASE_PLAT=%s\nBASE_SOC=%s\n" % (mode, plat, socdir))
          PY

      - name: Extract binaries and uefiplat.cfg with UEFIReader
        if: env.MODE != 'existing'
        run: |
          git clone --depth 1 https://github.com/WOA-Project/UEFIReader.git /tmp/UEFIReader
          dotnet build /tmp/UEFIReader/UEFIReader.sln -c Release
          DLL=$(find /tmp/UEFIReader -name UEFIReader.dll -path "*Release*" | head -1)
          mkdir -p /tmp/xbl-out
          dotnet "$DLL" port-input/xbl.img /tmp/xbl-out
          find /tmp/xbl-out -maxdepth 2 | head -50
          find /tmp/xbl-out -name uefiplat.cfg | grep -q . || { echo "::error::uefiplat.cfg not found in UEFIReader output"; exit 1; }

      # ---------- PLATFORM: copy the closest one, or scaffold a new one ----------
      - name: Create platform dir (copy or scaffold)
        if: env.MODE != 'existing'
        run: |
          NEW_PLAT="Platforms/$VENDOR/${CODE}Pkg"
          NEWGUID=$(uuidgen | tr a-z A-Z)
          mkdir -p "Platforms/$VENDOR"

          if [ -d "$NEW_PLAT" ]; then
            echo "$NEW_PLAT already exists, keeping it"
          elif [ -n "$BASE_PLAT" ]; then
            OLD=$(basename "$BASE_PLAT" | sed 's/Pkg$//')
            cp -r "$BASE_PLAT" "$NEW_PLAT"
            find "$NEW_PLAT" -depth -name "*$OLD*" | while read -r p; do
              mv "$p" "$(dirname "$p")/$(basename "$p" | sed "s/$OLD/$CODE/g")"
            done
            grep -rIl "$OLD" "$NEW_PLAT" | xargs -r sed -i "s/${OLD}Pkg/${CODE}Pkg/g; s/$OLD/$CODE/g"
            DSC=$(find "$NEW_PLAT" -name "*.dsc" | head -1)
            OLDGUID=$(grep -m1 -oP 'PLATFORM_GUID\s*=\s*\K[0-9A-Fa-f-]+' "$DSC")
            sed -i "s/$OLDGUID/$NEWGUID/" "$DSC"
            echo "copied $OLD -> $CODE, guid $OLDGUID -> $NEWGUID" | tee -a port.log
            if [ -f "Resources/Configs/$OLD.conf" ]; then cp "Resources/Configs/$OLD.conf" "Resources/Configs/$CODE.conf"; else echo "::warning::Resources/Configs/$OLD.conf not found"; fi
          else
            echo "No similar platform: scaffolding $NEW_PLAT from scratch" | tee -a port.log
            mkdir -p "$NEW_PLAT/Library/DeviceMemoryMapLib" \
                     "$NEW_PLAT/Library/DeviceConfigurationMapLib" \
                     "$NEW_PLAT/Include/Configuration" \
                     "$NEW_PLAT/FdtBlob" "Resources/Configs"

            cat > "$NEW_PLAT/$CODE.dsc" <<EOF
          [Defines]
            PLATFORM_NAME                  = $CODE
            PLATFORM_GUID                  = $NEWGUID
            PLATFORM_VERSION               = 0.1
            DSC_SPECIFICATION              = 0x00010005
            OUTPUT_DIRECTORY               = Build/${CODE}Pkg
            SUPPORTED_ARCHITECTURES        = AARCH64
            BUILD_TARGETS                  = DEBUG|RELEASE
            SKUID_IDENTIFIER               = DEFAULT
            FLASH_DEFINITION               = Platforms/$VENDOR/${CODE}Pkg/$CODE.fdf

          !include Silicon/Qualcomm/${SOC}Pkg/${SOC}.dsc.inc

          [LibraryClasses.common]
            DeviceMemoryMapLib|Platforms/$VENDOR/${CODE}Pkg/Library/DeviceMemoryMapLib/DeviceMemoryMapLib.inf
            DeviceConfigurationMapLib|Platforms/$VENDOR/${CODE}Pkg/Library/DeviceConfigurationMapLib/DeviceConfigurationMapLib.inf

          [Components.common]
            Platforms/$VENDOR/${CODE}Pkg/Library/DeviceMemoryMapLib/DeviceMemoryMapLib.inf
            Platforms/$VENDOR/${CODE}Pkg/Library/DeviceConfigurationMapLib/DeviceConfigurationMapLib.inf
          EOF

            cat > "$NEW_PLAT/$CODE.fdf" <<EOF
          [Defines]
          !include Silicon/Qualcomm/${SOC}Pkg/${SOC}.fdf.inc
          EOF

            cat > "$NEW_PLAT/Library/DeviceMemoryMapLib/DeviceMemoryMapLib.inf" <<EOF
          [Defines]
            INF_VERSION    = 0x00010005
            BASE_NAME      = DeviceMemoryMapLib
            FILE_GUID      = $(uuidgen | tr a-z A-Z)
            MODULE_TYPE    = BASE
            VERSION_STRING = 1.0
            LIBRARY_CLASS  = DeviceMemoryMapLib

          [Sources.common]
            DeviceMemoryMapLib.c

          [Packages]
            MdePkg/MdePkg.dec
            Silicon/Qualcomm/${SOC}Pkg/${SOC}Pkg.dec
          EOF

            cat > "$NEW_PLAT/Library/DeviceMemoryMapLib/DeviceMemoryMapLib.c" <<'EOF'
          #include <Library/BaseLib.h>
          // Skeleton: silicium_port.py regenerates this from the device tree + uefiplat.cfg.
          EOF

            cat > "$NEW_PLAT/Library/DeviceConfigurationMapLib/DeviceConfigurationMapLib.inf" <<EOF
          [Defines]
            INF_VERSION    = 0x00010005
            BASE_NAME      = DeviceConfigurationMapLib
            FILE_GUID      = $(uuidgen | tr a-z A-Z)
            MODULE_TYPE    = BASE
            VERSION_STRING = 1.0
            LIBRARY_CLASS  = DeviceConfigurationMapLib

          [Sources.common]
            DeviceConfigurationMapLib.c

          [Packages]
            MdePkg/MdePkg.dec
            Silicon/Qualcomm/${SOC}Pkg/${SOC}Pkg.dec
          EOF

            cat > "$NEW_PLAT/Library/DeviceConfigurationMapLib/DeviceConfigurationMapLib.c" <<'EOF'
          #include <Library/BaseLib.h>
          // Skeleton: silicium_port.py regenerates this config map.
          EOF

            cat > "Resources/Configs/$CODE.conf" <<EOF
          TARGET_DEVICE="$CODE"
          TARGET_DEVICE_VENDOR="$VENDOR"
          TARGET_SOC="$SOC"
          EOF
          fi
          echo "NEW_PLAT=$NEW_PLAT" >> "$GITHUB_ENV"

      # ---------- SoC PACKAGE: keep, copy the closest one, or scaffold a new one ----------
      - name: Create SoC package dir (keep, copy or scaffold)
        if: env.MODE != 'existing'
        run: |
          NEW_SOC="Silicon/Qualcomm/${SOC}Pkg"
          if [ -e "$NEW_SOC" ]; then
            echo "$NEW_SOC already exists, keeping it"
          elif [ -n "$BASE_SOC" ]; then
            OLDSOC=$(basename "$BASE_SOC" | sed 's/Pkg$//')
            cp -r "$BASE_SOC" "$NEW_SOC"
            find "$NEW_SOC" -depth -name "*$OLDSOC*" | while read -r p; do
              mv "$p" "$(dirname "$p")/$(basename "$p" | sed "s/$OLDSOC/$SOC/g")"
            done
            grep -rIl "$OLDSOC" "$NEW_SOC" | xargs -r sed -i "s/$OLDSOC/$SOC/g"
            grep -rIl "$OLDSOC" "$NEW_PLAT" | xargs -r sed -i "s/$OLDSOC/$SOC/g"
            echo "copied SoC $OLDSOC -> $SOC" | tee -a port.log
          else
            echo "No similar SoC package: scaffolding $NEW_SOC from scratch" | tee -a port.log
            mkdir -p "$NEW_SOC/Include" "$NEW_SOC/Library"
            cat > "$NEW_SOC/${SOC}Pkg.dec" <<EOF
          [Defines]
            DEC_SPECIFICATION = 0x00010005
            PACKAGE_NAME      = ${SOC}Pkg
            PACKAGE_GUID      = $(uuidgen | tr a-z A-Z)
            PACKAGE_VERSION   = 0.1

          [Includes]
            Include

          [PcdsFixedAtBuild]
            # GIC / timer / core-count PCDs get filled in by silicium_port.py
          EOF
            cat > "$NEW_SOC/${SOC}.dsc.inc" <<EOF
          [PcdsFixedAtBuild.common]
            # Filled in by silicium_port.py (GIC, timer, cores)
          EOF
            cat > "$NEW_SOC/${SOC}.fdf.inc" <<EOF
          # Firmware volume layout for ${SOC}: fill in APRIORI/DXE/RAW order by hand (UEFITool).
          EOF
          fi
          echo "NEW_SOC=$NEW_SOC" >> "$GITHUB_ENV"

      - name: Place binaries and device tree
        if: env.MODE != 'existing'
        run: |
          mkdir -p "Binaries/$CODE" Resources/DTBs "$NEW_PLAT/FdtBlob"
          cp -r /tmp/xbl-out/. "Binaries/$CODE/"
          if [ -f Binaries/CleanUp.sh ]; then (cd Binaries && bash CleanUp.sh) || true; fi
          dtc -I dtb -O dts -q port-input/device-tree.dtb > "Resources/DTBs/$CODE.dts" || true
          cp port-input/device-tree.dtb "Resources/DTBs/$CODE.dtb"
          cp port-input/device-tree.dtb "$NEW_PLAT/FdtBlob/$CODE.dtb"

      - name: Generate memory map, config map, SoC PCDs, FD values
        if: env.MODE != 'existing'
        run: |
          MM=$(find "$NEW_PLAT" -name DeviceMemoryMapLib.c | head -1)
          CM=$(find "$NEW_PLAT" -name DeviceConfigurationMapLib.c | head -1)
          SOCINC=$(find "$NEW_SOC" -name "*.dsc.inc" | head -1)
          CFG=$(find /tmp/xbl-out -name uefiplat.cfg | head -1)
          ARGS=""
          if [ -f "Resources/Configs/$CODE.conf" ]; then ARGS="--device-conf Resources/Configs/$CODE.conf"; fi
          python3 -I .ci/silicium_port.py --dts "Resources/DTBs/$CODE.dts" --cfg "$CFG" \
            --memmap-template "$MM" --confmap-template "$CM" \
            --out-memmap "$MM" --out-confmap "$CM" \
            --soc-dsc-inc "$SOCINC" $ARGS --report port-report.md | tee -a port.log

      - name: Try a DEBUG build
        continue-on-error: true
        run: |
          ./setup_env.sh -p apt
          ./build_uefi.sh -d "$CODE" -r DEBUG 2>&1 | tee build.log

      - name: Pack the generated tree
        if: always()
        run: |
          tar czf "${CODE}-port-tree.tgz" \
            "Platforms/$VENDOR/${CODE}Pkg" "Silicon/Qualcomm/${SOC}Pkg" \
            "Resources/Configs/$CODE.conf" "Resources/DTBs/$CODE.dts" "Resources/DTBs/$CODE.dtb" \
            "Binaries/$CODE" port-report.md 2>/dev/null || true

      - name: Upload report, logs, generated tree, image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ inputs.codename }}
          path: |
            mu/port-report.md
            mu/port.log
            mu/build.log
            mu/*-port-tree.tgz
            mu/**/*.img
          retention-days: 14
